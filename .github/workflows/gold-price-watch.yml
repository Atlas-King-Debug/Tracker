name: Gold Price Watcher

on:
  schedule:
    # Runs at :07, :22, :37, :52 past every hour (roughly every 15 minutes).
    # Deliberately offset away from :00/:15/:30/:45 because that's when
    # everyone else's cron jobs fire too, which is when GitHub's shared
    # runners get backed up and delay/drop scheduled runs. Off-the-mark
    # times get queued more reliably.
    #
    # GitHub Actions cron is UTC and always "best effort" — it can still
    # slip by several minutes, and that's normal, not a sign of a bug.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated price file

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run gold price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_gold_price.py

      - name: Commit updated price file (if changed)
        run: |
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          git add last_price.txt
          git diff --staged --quiet || git commit -m "Update last known 22K gold price"
          git push
