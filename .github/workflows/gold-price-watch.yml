name: Gold Price Watcher

on:
  schedule:
    # Runs every 15 minutes. GitHub Actions cron is UTC and "best effort"
    # (can slip a few minutes during high load) — that's fine here since
    # we only ever message you when the price actually changes.
    # If your repo is PUBLIC (unlimited free Actions minutes), you can
    # safely change this to */5 for near-real-time checks.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated price file

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run gold price check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_gold_price.py

      - name: Commit updated price file (if changed)
        run: |
          git config user.name "gold-price-bot"
          git config user.email "actions@github.com"
          git add last_price.txt
          git diff --staged --quiet || git commit -m "Update last known 22K gold price"
          git push
